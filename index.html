<style>
  body { 
    margin: 0; 
    background: transparent; 
    font-family: Arial, sans-serif;
  }

  /* Centrado absoluto e inmune al colapso del iframe */
  .wa {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* Centrado matemático exacto */
    
    display: flex;
    flex-direction: column;
    align-items: center;
    
    /* Animación de entrada combinada con el centrado */
    animation: entrance 0.7s ease forwards;
    opacity: 0;
  }

  @keyframes entrance {
    0% { transform: translate(-50%, -30%); opacity: 0; }
    60% { transform: translate(-50%, -52%); opacity: 1; }
    100% { transform: translate(-50%, -50%); opacity: 1; }
  }

  .btn {
    width: 70px;
    height: 70px;
    background: #25D366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    animation: floatSoft 3s ease-in-out infinite;
  }

  /* El mensaje flotando de forma natural arriba del botón */
  .msg {
    background: white;
    padding: 16px 18px;
    border-radius: 12px;
    width: 280px;
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 15px; /* Crea la separación física */
    text-align: center;
    box-shadow: 0 12px 35px rgba(0,0,0,0.28);
    
    /* Efecto de aparición suave interna */
    opacity: 0;
    transition: all 0.35s ease;
  }

  .wa.show .msg {
    opacity: 1;
  }

  @keyframes floatSoft {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }

  /* Adaptación Responsiva dentro del Iframe */
  @media(max-width:768px){
    .btn {
      width: 80px;
      height: 80px;
    }

    .btn svg {
      width: 48px;
      height: 48px;
    }

    .msg {
      width: 290px;
      font-size: 16px;
      padding: 16px;
    }
  }
</style>
