<style>
  /* 1. Convertimos el body en el contenedor centrado absoluto */
  body { 
    margin: 0; 
    background: transparent; 
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh; /* Ocupa el 100% del alto del iframe */
    font-family: Arial, sans-serif;
  }

  /* 2. Eliminamos el posicionamiento fixed para que responda a Flexbox */
  .wa {
    position: relative; 
    display: flex;
    flex-direction: column;
    align-items: center; /* Centra el botón respecto al cuadro de texto */
    animation: entrance 0.7s ease forwards;
    opacity: 0;
  }

  @keyframes entrance {
    0% { transform: translateY(40px); opacity: 0; }
    60% { transform: translateY(-5px); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .btn {
    width: 70px;
    height: 70px;
    background: #25D366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    animation: floatSoft 3s ease-in-out infinite;
  }

  /* 3. Ajustamos el mensaje para que se posicione arriba del botón de forma fluida */
  .msg {
    background: white;
    padding: 16px 18px;
    border-radius: 12px;
    width: 280px;
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 15px; /* Espacio de separación con el botón inferior */
    text-align: center; /* Opcional: centra el texto interno para estética de iframe */
    
    opacity: 0;
    transform: translateY(10px) scale(0.96);
    box-shadow: 0 12px 35px rgba(0,0,0,0.28);
    transition: all 0.35s ease;
  }

  .wa.show .msg {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  @keyframes floatSoft {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }

  /* 4. Simplificamos los Media Queries ya que Flexbox se encarga del centrado */
  @media(max-width:768px){
    .btn {
      width: 90px;
      height: 90px;
      opacity: .85;
    }

    .btn svg {
      width: 56px;
      height: 56px;
    }

    .msg {
      width: 320px;
      font-size: 18px;
      padding: 18px;
    }
  }
</style>
